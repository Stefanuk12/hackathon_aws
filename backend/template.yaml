AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Amacide - AWS North x Northumbria Hackathon

Parameters:
  TextModelId:
    Type: String
    Default: eu.anthropic.claude-sonnet-4-5-20250929-v1:0 # TODO person 4: confirm model access + ID in region
  ImageModelId:
    Type: String
    Default: amazon.nova-canvas-v1:0 # or a Stability model, e.g. stability.stable-image-core-v1:1 (set ImageRegion to us-west-2)
  ImageRegion:
    Type: String
    Default: eu-west-1 # image models aren't in eu-west-2; Nova Canvas is in eu-west-1

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 512
    CodeUri: src/
    Environment:
      Variables:
        TABLE_NAME: !Ref GameTable
        BUCKET_NAME: !Ref DrawingsBucket
        EVENTS_HTTP_DOMAIN: !GetAtt EventApi.Dns.Http
        EVENTS_API_KEY: !GetAtt EventApiKey.ApiKey
        TEXT_MODEL_ID: !Ref TextModelId
        IMAGE_MODEL_ID: !Ref ImageModelId
        IMAGE_REGION: !Ref ImageRegion

Resources:
  # ---------- Storage ----------
  GameTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  DrawingsBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]

  # ---------- Realtime (AppSync Events) ----------
  EventApi:
    Type: AWS::AppSync::Api
    Properties:
      Name: amacide-events
      EventConfig:
        AuthProviders: [{ AuthType: API_KEY }]
        ConnectionAuthModes: [{ AuthType: API_KEY }]
        DefaultPublishAuthModes: [{ AuthType: API_KEY }]
        DefaultSubscribeAuthModes: [{ AuthType: API_KEY }]

  EventApiKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt EventApi.ApiId

  RoomsNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties:
      ApiId: !GetAtt EventApi.ApiId
      Name: rooms

  # ---------- HTTP API ----------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: ["*"]

  CreateRoomFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: rooms/create_room.handler
      Policies: [{ DynamoDBCrudPolicy: { TableName: !Ref GameTable } }]
      Events:
        Api: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: "/rooms" } }

  JoinRoomFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: rooms/join_room.handler
      Policies: [{ DynamoDBCrudPolicy: { TableName: !Ref GameTable } }]
      Events:
        Api: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: "/rooms/{code}/join" } }

  GetRoomFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: rooms/get_room.handler
      Policies: [{ DynamoDBReadPolicy: { TableName: !Ref GameTable } }]
      Events:
        Api: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/rooms/{code}" } }

  StartRoundFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: rooms/start_round.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref GameTable }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: "*"
      Events:
        Api: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: "/rooms/{code}/start" } }

  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: rooms/upload_url.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref GameTable }
        - S3WritePolicy: { BucketName: !Ref DrawingsBucket }
      Events:
        Api: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: "/rooms/{code}/upload-url" } }

  SubmitFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: rooms/submit.handler
      Environment:
        Variables:
          JUDGE_STATE_MACHINE_ARN: !Ref JudgeRoundStateMachine
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref GameTable }
        - StepFunctionsExecutionPolicy: { StateMachineName: !GetAtt JudgeRoundStateMachine.Name }
      Events:
        Api: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: "/rooms/{code}/submit" } }

  EndRoundFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: rooms/end_round.handler
      Environment:
        Variables:
          JUDGE_STATE_MACHINE_ARN: !Ref JudgeRoundStateMachine
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref GameTable }
        - StepFunctionsExecutionPolicy: { StateMachineName: !GetAtt JudgeRoundStateMachine.Name }
      Events:
        Api: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: "/rooms/{code}/end" } }

  ResetRoomFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: rooms/reset_room.handler
      Policies: [{ DynamoDBCrudPolicy: { TableName: !Ref GameTable } }]
      Events:
        Api: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: "/rooms/{code}/reset" } }

  # ---------- Judging pipeline (Step Functions) ----------
  JudgeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: ai/judge.handler
      Timeout: 120
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref GameTable }
        - S3CrudPolicy: { BucketName: !Ref DrawingsBucket } # reads drawings, writes reference images
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: "*"

  HostVoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: ai/host_voice.handler
      Timeout: 60
      Policies:
        - S3CrudPolicy: { BucketName: !Ref DrawingsBucket }
        - Statement:
            - Effect: Allow
              Action: [polly:SynthesizeSpeech]
              Resource: "*"

  SaveResultsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: rooms/save_results.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref GameTable }
        - S3ReadPolicy: { BucketName: !Ref DrawingsBucket }

  JudgeRoundStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: statemachine/judge_round.asl.json
      DefinitionSubstitutions:
        JudgeFunctionArn: !GetAtt JudgeFunction.Arn
        HostVoiceFunctionArn: !GetAtt HostVoiceFunction.Arn
        SaveResultsFunctionArn: !GetAtt SaveResultsFunction.Arn
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref JudgeFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref HostVoiceFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref SaveResultsFunction }

  # ---------- Frontend hosting ----------
  # Private bucket; only CloudFront can read it (OAC). Upload with:
  #   aws s3 sync frontend/dist s3://<FrontendBucketName> --delete
  FrontendBucket:
    Type: AWS::S3::Bucket

  FrontendOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOac.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS managed "CachingOptimized"

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  EventsHttpDomain:
    Value: !GetAtt EventApi.Dns.Http
  EventsRealtimeDomain:
    Value: !GetAtt EventApi.Dns.Realtime
  EventsApiKey:
    Value: !GetAtt EventApiKey.ApiKey
  DrawingsBucketName:
    Value: !Ref DrawingsBucket
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FrontendUrl:
    Value: !Sub "https://${FrontendDistribution.DomainName}"
